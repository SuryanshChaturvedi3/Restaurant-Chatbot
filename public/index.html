<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro AI | Dark Mode</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-accent: #818cf8;
            --user-bubble: #4f46e5;
            --bot-bubble: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: var(--card-bg);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
        }

        header h2 { margin: 0; font-weight: 600; font-size: 1.2rem; letter-spacing: 0.5px; }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Message Styles */
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: var(--user-bubble);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: var(--bot-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        /* Suggestion Chips */
        .suggestions-container {
            padding: 10px 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }
        .suggestions-container::-webkit-scrollbar { display: none; }

        .chip {
            background: transparent;
            border: 1px solid var(--primary-accent);
            color: var(--primary-accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            background: var(--primary-accent);
            color: white;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: #1e293b;
            border-top: 1px solid var(--border);
        }

        .input-row {
            display: flex;
            gap: 10px;
            background: #0f172a;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            outline: none;
        }

        button {
            background: var(--primary-accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>✨ Bistro Assistant</h2>
    </header>

    <div id="chatBox" class="chat-box">
        <div class="msg ai-msg">Welcome to Bistro Midnight! 🌙<br>What can I get started for you?</div>
    </div>

    <div class="suggestions-container">
        <button class="chip" onclick="applySuggestion('Show Breakfast menu')">🍳 Breakfast</button>
        <button class="chip" onclick="applySuggestion('Lunch specials')">🥪 Lunch</button>
        <button class="chip" onclick="applySuggestion('Dinner options')">🍷 Dinner</button>
        
    </div>

    <div class="input-area">
        <div class="input-row">
            <input id="userInput" type="text" placeholder="Ask about menu..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    function addMessage(sender, text) {
        const msg = document.createElement("div");
        msg.className = sender === "user" ? "msg user-msg" : "msg ai-msg";
        msg.innerHTML = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // New helper for chips
    function applySuggestion(text) {
        userInput.value = text;
        sendMessage();
    }

    async function sendMessage() {
        const input = userInput.value.trim();
        if (!input) return;

        addMessage("user", input);
        userInput.value = "";

        // Simulated API call
        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ input }),
            });
            const data = await res.json();
            addMessage("bot", data.response);
        } catch (err) {
            // Mock response for preview purposes if API doesn't exist
            setTimeout(() => {
                addMessage("bot", "Checking the " + input + " for you...");
            }, 600);
        }
    }

    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
